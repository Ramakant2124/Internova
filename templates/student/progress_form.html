{% extends 'base.html' %}
{% block title %}Edit Weekly Progress{% endblock %}
{% block content %}
<div class="container-fluid px-3 mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="form-card">
                <div class="form-card-header">
                    <h5><i class="bi bi-graph-up"></i> Edit Weekly Report</h5>
                    <p class="form-subtitle">Week of {{ report.week_start }}</p>
                </div>
                <div class="form-card-body">
                    <form method="post" enctype="multipart/form-data" novalidate>
                        {% csrf_token %}
                        {% with form_grid=True %}
                        {% include 'partials/form_field.html' %}
                        {% endwith %}
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                            <a href="{% url 'students:weekly_progress' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
