{% extends 'base.html' %}
{% block title %}Set New Password{% endblock %}
{% block auth_content %}
<style>
    .auth-reset-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 15px;
    }

    .auth-reset-page .auth-card {
        width: 100%;
        max-width: 450px;
        border-radius: 18px;
        overflow: hidden;
        background: #ffffff;
        border: 1px solid #e8e5f1;
        box-shadow: 0 4px 24px rgba(111, 66, 193, 0.08), 0 10px 40px rgba(0, 0, 0, 0.08);
        background-color: #ffffff53;
    }

    .auth-reset-page .card-body {
        padding: 40px;
    }

    .auth-reset-page h4 {
        color: #1a1a2e;
        font-weight: 700;
    }

    .auth-reset-page h4 i {
        color: #6f42c1;
    }

    .auth-reset-page .form-control {
        border-radius: 10px;
        min-height: 48px;
        padding: 10px 14px;
        border: 1.5px solid #ddd8ed;
        background: #fdfcff;
        transition: border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .auth-reset-page .form-control:focus {
        border-color: #6f42c1;
        box-shadow: 0 0 0 3px rgba(111, 66, 193, 0.13);
    }

    .auth-reset-page .btn-primary {
        background: linear-gradient(135deg, #6f42c1 0%, #7c4dff 50%, #6f42c1 100%);
        background-size: 200% 200%;
        border: none;
        border-radius: 12px;
        min-height: 50px;
        font-weight: 600;
        box-shadow: 0 4px 16px rgba(111, 66, 193, 0.3);
        transition: all 0.3s ease;
    }

    .auth-reset-page .btn-primary:hover {
        background-position: 100% 0;
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(111, 66, 193, 0.4);
    }
</style>
<div class="auth-reset-page">
    <div class="card auth-card shadow-lg border-0 w-100">
        <div class="card-body">
            <h4 class="fw-bold mb-3"><i class="bi bi-shield-lock me-2"></i>Set New Password</h4>
            <form method="post" novalidate>
                {% csrf_token %}
                {% include 'partials/form_field.html' %}
                <div class="d-grid"><button type="submit" class="btn btn-primary">Reset Password</button></div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
