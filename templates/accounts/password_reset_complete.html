{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block auth_content %}
<div class="container d-flex justify-content-center align-items-center auth-bg">
    <div class="card auth-card shadow-lg border-0 w-100">
        <div class="card-body p-4 p-md-5 text-center">
            <i class="bi bi-check-circle display-4 text-success"></i>
            <h4 class="fw-bold mt-2">Password Reset Complete</h4>
            <p class="text-muted">Your password has been reset. You can now log in.</p>
            <a href="{% url 'accounts:home' %}" class="btn btn-primary">Go to Login</a>
        </div>
    </div>
</div>
{% endblock %}
