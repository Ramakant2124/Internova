{% extends 'base.html' %}
{% block title %}New Allocation{% endblock %}
{% block content %}
<div class="container-fluid px-3 mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="form-card">
                <div class="form-card-header">
                    <h5><i class="bi bi-arrow-left-right"></i> Allocate Internship to Student</h5>
                    <p class="form-subtitle">Assign a student to an internship position</p>
                </div>
                <div class="form-card-body">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        {% with form_grid=True %}
                        {% include 'partials/form_field.html' %}
                        {% endwith %}
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Allocate</button>
                            <a href="{% url 'college:allocations' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
