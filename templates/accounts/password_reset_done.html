{% extends 'base.html' %}
{% block title %}Reset Link Sent{% endblock %}
{% block auth_content %}
<div class="container d-flex justify-content-center align-items-center auth-bg">
    <div class="card auth-card shadow-lg border-0 w-100">
        <div class="card-body p-4 p-md-5 text-center">
            <i class="bi bi-envelope-check display-4 text-success"></i>
            <h4 class="fw-bold mt-2">Check your email</h4>
            <p class="text-muted">If an account exists for the email you entered, a password reset link has been sent.</p>
            <a href="{% url 'accounts:home' %}" class="btn btn-primary">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
