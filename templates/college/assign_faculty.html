{% extends 'base.html' %}
{% block title %}Assign Faculty Mentor{% endblock %}
{% block content %}
<div class="container-fluid px-3 mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="form-card">
                <div class="form-card-header">
                    <h5><i class="bi bi-person-raised-hand"></i> Assign Faculty Mentor</h5>
                    <p class="form-subtitle">{{ allocation.student.full_name }} &middot; {{ allocation.internship.title }}</p>
                </div>
                <div class="form-card-body">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        {% include 'partials/form_field.html' %}
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Assign</button>
                            <a href="{% url 'college:allocations' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
