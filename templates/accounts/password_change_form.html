{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="container-fluid px-3 mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="form-card">
                <div class="form-card-header">
                    <h5><i class="bi bi-shield-lock"></i> Change Password</h5>
                    <p class="form-subtitle">Update your account password for security</p>
                </div>
                <div class="form-card-body">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        {% include 'partials/form_field.html' %}
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Change Password</button>
                            <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
